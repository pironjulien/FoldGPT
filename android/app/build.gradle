apply plugin: 'com.android.application'
android {
    namespace 'app.foldgpt'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'app.foldgpt'
        minSdk 30
        targetSdk 37
        versionCode 2
        versionName '0.2.0-dev'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets.main.jniLibs.srcDirs = ['../native/runtime']
    sourceSets.debug.jniLibs.srcDirs = ['../native/debug']
    externalNativeBuild { cmake { path '../install-native/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { debug { debuggable true } }
}
dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.window:window-java:1.5.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    testImplementation 'junit:junit:4.13.2'
}

// The native file transport fixture executes only these APK-owned public source
// files. Generated assets are debug-only, so the release has no probe payload.
def nativeFilesRpcAssets = layout.buildDirectory.dir('generated/nativeFilesRpcAssets')
abstract class NativeFilesRpcAssets extends Sync {
    @OutputDirectory abstract DirectoryProperty getOutputDir()
}
def syncNativeFilesRpcAssets = tasks.register('syncNativeFilesRpcAssets', NativeFilesRpcAssets) {
    from(rootProject.file('..')) {
        include 'tools/executor/exec_server.py', 'tools/executor/native_files.py',
                'tools/executor/policy_intent.py', 'tools/policy/managed_policy.py',
                'tools/executor/native_files_server.py', 'tools/executor/native_files_rpc_fixture.py'
        into 'native-files-rpc'
    }
    outputDir.set(nativeFilesRpcAssets)
    into outputDir
}
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(syncNativeFilesRpcAssets) { it.outputDir }
}
def privateExecProbeAssets = layout.buildDirectory.dir('generated/privateExecProbeAssets')
def syncPrivateExecProbeAssets = tasks.register('syncPrivateExecProbeAssets', NativeFilesRpcAssets) {
    from(rootProject.file('..')) {
        include 'tools/executor/exec_server.py', 'tools/executor/native_files.py',
                'tools/executor/policy_intent.py', 'tools/policy/managed_policy.py',
                'tools/executor/native_files_rpc_fixture.py',
                'tools/executor/native_file_streams.py',
                'tools/executor/private_exec_broker.py', 'tools/executor/private_exec_fixture.py'
        into 'private-exec-probe'
    }
    outputDir.set(privateExecProbeAssets)
    into outputDir
}
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(syncPrivateExecProbeAssets) { it.outputDir }
}
// An explicit local staging directory from the authenticated Android CPython
// recipe. APK signature covers the embedded libraries and standard library.
android.sourceSets.debug.assets.srcDir(rootProject.file('../android/native/python-debug-assets'))

// Local native outputs are ignored by Git. A stale diagnostic must never enter
// production merely because it was left in the runtime build directory.
tasks.register('verifyRuntimeLibraries') {
    doLast {
        def runtime = file('../native/runtime')
        def allowed = ['libproot.so', 'libproot-loader.so', 'libproot-loader32.so',
                       'libtalloc.so', 'libandroid-shmem.so']
            .collect { 'arm64-v8a/' + it }.toSet()
        def actual = fileTree(runtime).files.collect {
            runtime.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.toSet()
        if (actual != allowed) {
            throw new GradleException("Native runtime inputs differ: missing=${allowed - actual}, unexpected=${actual - allowed}. Diagnostics belong in native/debug.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyRuntimeLibraries' }
