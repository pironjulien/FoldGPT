apply plugin: 'com.android.application'
android {
    namespace 'app.foldgpt'
    compileSdk 37
    defaultConfig {
        applicationId 'app.foldgpt'
        minSdk 30
        targetSdk 37
        versionCode 2
        versionName '0.2.0-dev'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets.main.jniLibs.srcDirs = ['../native/runtime']
    buildTypes { debug { debuggable true } }
}
dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.window:window-java:1.5.0'
}
