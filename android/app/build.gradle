// Local native outputs are ignored by Git. A stale diagnostic must never enter
// production merely because it was left in the runtime build directory.
tasks.register('verifyRuntimeLibraries') {
    doLast {
        def runtime = file('../native/runtime')
        def allowed = ['libproot.so', 'libproot-loader.so', 'libproot-loader32.so',
                       'libtalloc.so', 'libandroid-shmem.so']
            .collect { 'arm64-v8a/' + it }.toSet()
        def actual = fileTree(runtime).files.collect {
            runtime.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.toSet()
        if (actual != allowed) {
            throw new GradleException("Native runtime inputs differ: missing=${allowed - actual}, unexpected=${actual - allowed}. Diagnostics belong in native/debug.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyRuntimeLibraries' }
