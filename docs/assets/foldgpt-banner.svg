<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">FoldGPT — The desktop workspace that unfolds.</title>
  <desc id="description">The canonical graphite and gold FoldGPT application mark beside the product name. Decorative vector artwork, not a device photograph or demonstration.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#15181E"/><stop offset=".64" stop-color="#08090B"/><stop offset="1" stop-color="#15181E"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#D7B56D" stop-opacity=".12"/><stop offset="1" stop-color="#D7B56D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D7B56D" stroke-opacity=".028"/></pattern>
    <linearGradient id="thread"><stop stop-color="#D7B56D" stop-opacity="0"/><stop offset=".7" stop-color="#D7B56D" stop-opacity=".65"/><stop offset="1" stop-color="#F4E4C0" stop-opacity=".9"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="480" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="url(#background)" d="M0 0H1280V480H0Z"/>
    <path fill="url(#grid)" d="M0 0H1280V480H0Z"/>
    <ellipse cx="1008" cy="240" rx="390" ry="330" fill="url(#glow)"/>
    <path d="M72 62H96" stroke="#D7B56D" stroke-width="2"/>
    <text x="108" y="66" fill="#B5AA94" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="3">LOCAL DESKTOP · ANDROID HOST</text>
    <text x="66" y="195" fill="#F3EFE7" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="700" letter-spacing="-5">Fold<tspan fill="#D7B56D">GPT</tspan></text>
    <text x="72" y="251" fill="#E8E4DC" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="-.7">The desktop workspace</text>
    <text x="72" y="291" fill="#E8E4DC" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="-.7">that unfolds.</text>
    <path d="M72 329H595" stroke="#D7B56D" stroke-opacity=".14"/>
    <text x="72" y="363" fill="#A3A39E" font-family="Arial,Helvetica,sans-serif" font-size="16">ChatGPT Desktop. Codex. Real project files.</text>
    <text x="72" y="403" fill="#D7B56D" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.1">ARM64 LOCAL</text>
    <circle cx="210" cy="399" r="2" fill="#5D5749"/>
    <text x="228" y="403" fill="#A7A399" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.1">NO ROOT REQUIRED</text>
    <path d="M710 62V418" stroke="#D7B56D" stroke-opacity=".08"/>
    <g fill="none" stroke="#D7B56D">
