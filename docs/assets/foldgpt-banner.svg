      <circle cx="781" cy="244" r="1.5" opacity=".25"/><circle cx="1205" cy="226" r="1.5" opacity=".25"/><circle cx="1168" cy="389" r="1.5" opacity=".4"/><circle cx="827" cy="391" r="1.5" opacity=".4"/>
