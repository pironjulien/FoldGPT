plugins { id 'com.android.application' }
def expectedProbeSha = providers.gradleProperty('probeSha256').getOrElse('').toLowerCase(Locale.ROOT)
if (expectedProbeSha && !(expectedProbeSha ==~ /[0-9a-f]{64}/)) {
    throw new GradleException('probeSha256 must be exactly 64 hexadecimal characters')
}
android {
    namespace 'app.foldgpt.shizukuprobe'
    compileSdk 37
    defaultConfig {
        applicationId 'app.foldgpt.shizukuprobe'
        minSdk 30
        targetSdk 37
        versionCode 5
        versionName '5.0-fixed-probe-runtime-data'
        buildConfigField 'String', 'PROBE_SHA256', '"' + expectedProbeSha + '"'
    }
    buildFeatures { aidl true; buildConfig true }
    buildTypes { debug { debuggable true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
