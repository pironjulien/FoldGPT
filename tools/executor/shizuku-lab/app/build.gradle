plugins { id 'com.android.application' }
apply from: '../../../recovery/android-signing.gradle'
def expectedProbeSha = providers.gradleProperty('probeSha256').getOrElse('').toLowerCase(Locale.ROOT)
if (expectedProbeSha && !(expectedProbeSha ==~ /[0-9a-f]{64}/)) {
    throw new GradleException('probeSha256 must be exactly 64 hexadecimal characters')
}
if (expectedProbeSha != '7fa4f638c431866e69dcda8618a3e8872b19861941d5d7bd1dbc8ec92352893b') {
    throw new GradleException('The additive update must preserve the reviewed v5 fixed-probe digest')
}
android {
    namespace 'app.foldgpt.shizukuprobe'
    compileSdk 37
    defaultConfig {
        applicationId 'app.foldgpt.shizukuprobe'
        minSdk 30
        targetSdk 37
        versionCode 10
        versionName '10.0-stdio-session-owner'
        buildConfigField 'String', 'PROBE_SHA256', '"' + expectedProbeSha + '"'
    }
    buildFeatures { aidl true; buildConfig true }
    buildTypes { debug { debuggable true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    ndkVersion '29.0.14206865'
    defaultConfig { ndk { abiFilters 'arm64-v8a' } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    sourceSets.main.java.srcDir('../../shizuku-service/qualification/src/main/java')
    sourceSets.main.assets.srcDir('../build/kernel-stage-v10/assets')
    sourceSets.main.jniLibs.srcDir('../build/kernel-stage-v10/jniLibs')
}
dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation project(':shizukuTransport')
}

tasks.named('preBuild').configure {
    doFirst {
        def staged = file('../build/kernel-stage-v10/assets/foldgpt-executor-deployment.json')
        if (!staged.isFile() || new groovy.json.JsonSlurper().parse(staged).packageName != 'app.foldgpt.shizukuprobe') {
            throw new GradleException('The additive kernel diagnostic requires its lab-specific staged deployment')
        }
    }
}
