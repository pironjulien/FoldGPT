plugins { id 'com.android.library' }
android {
    namespace 'app.foldgpt.shizukuexec'
    compileSdk 37
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 30
        targetSdk 37
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        consumerProguardFiles 'consumer-rules.pro'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { aidl true }
    sourceSets.main.assets.exclude '**/__pycache__/**'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    api 'dev.rikka.shizuku:api:13.1.5'
    api 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
