plugins { id 'com.android.application' }
apply from: '../../../recovery/android-signing.gradle'

def qualificationVersion = providers.gradleProperty('foldgptQualificationVersion').getOrElse('11')
def qualificationBases = [
    '11': '/data/local/tmp/foldgpt-bionic-supervisor-qualification-v3',
    '12': '/data/local/tmp/foldgpt-bionic-supervisor-qualification-v4'
]
if (!qualificationBases.containsKey(qualificationVersion)) {
    throw new GradleException('Unknown independent qualification version')
}
def qualificationPackage = 'app.foldgpt.kernelqualification.v' + qualificationVersion
def qualificationBase = qualificationBases[qualificationVersion]
if (qualificationVersion != '11') {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir('modules/' + project.name)
}

android {
    namespace 'app.foldgpt.kernelqualification'
    compileSdk 37
    defaultConfig {
        applicationId qualificationPackage
        minSdk 30
        targetSdk 37
        versionCode qualificationVersion.toInteger()
        versionName qualificationVersion + '.0-independent-kernel-qualification'
        manifestPlaceholders = [qualificationLabel: 'FoldGPT kernel qualification V' + qualificationVersion]
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    buildTypes { debug { debuggable true } }
}
def staged = rootProject.layout.buildDirectory.dir('qualification-stage-v' + qualificationVersion)
android.sourceSets.main.assets.srcDir(staged.get().dir('assets').asFile)
android.sourceSets.main.jniLibs.srcDir(staged.get().dir('jniLibs').asFile)
tasks.named('preBuild').configure {
    doFirst {
        if (!staged.get().file('build-inventory.json').asFile.isFile()) {
            throw new GradleException('Run stage-qualification.py with the reviewed frozen backend and interpreter first')
        }
        def deploymentFile = staged.get().file('assets/foldgpt-executor-deployment.json').asFile
        if (!deploymentFile.isFile()) throw new GradleException('Independent deployment is absent')
        def deployment = new groovy.json.JsonSlurper().parse(deploymentFile)
        def inventory = new groovy.json.JsonSlurper().parse(staged.get().file('build-inventory.json').asFile)
        def base = qualificationBase
        if (inventory.package != qualificationPackage || inventory.base != base
                || deployment.packageName != qualificationPackage
                || deployment.workspace != base + '/workspace'
                || deployment.brokerDirectory != base + '/broker'
                || deployment.pythonRuntime?.path != base + '/python'
                || deployment.backendOptions?.workspace != base + '/workspace'
                || deployment.backendFactory != 'tools.executor.bionic-supervisor.qualification_factory_v' + qualificationVersion + ':factory') {
            throw new GradleException('The version requires its separate application identity and native fixture')
        }
    }
}
dependencies {
    implementation project(':transport')
    compileOnly 'androidx.annotation:annotation:1.3.0'
}
