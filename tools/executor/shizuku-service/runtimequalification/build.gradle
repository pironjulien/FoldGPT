plugins { id 'com.android.application' }
apply from: '../../../recovery/android-signing.gradle'

def runtimeVersion = providers.gradleProperty('foldgptRuntimeQualificationVersion').getOrElse('1')
if (!(runtimeVersion in ['1', '2'])) throw new GradleException('Unknown fixed runtime profile')
def runtimePackage = 'app.foldgpt.runtimequalification.v' + runtimeVersion
def runtimeBase = '/data/local/tmp/foldgpt-bionic-runtime-qualification-v' + runtimeVersion
layout.buildDirectory = rootProject.layout.buildDirectory.dir('modules/runtimequalification')
android {
    namespace 'app.foldgpt.runtimequalification'
    compileSdk 37
    defaultConfig {
        applicationId runtimePackage
        minSdk 30
        targetSdk 37
        versionCode runtimeVersion.toInteger()
        versionName runtimeVersion + '.0-native-runtime-qualification'
        manifestPlaceholders = [runtimeQualificationLabel: 'FoldGPT native Python qualification V' + runtimeVersion]
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
    buildTypes { debug { debuggable true } }
}
def staged = rootProject.layout.buildDirectory.dir('runtime-stage-v' + runtimeVersion)
android.sourceSets.main.assets.srcDir(staged.get().dir('assets').asFile)
android.sourceSets.main.jniLibs.srcDir(staged.get().dir('jniLibs').asFile)
tasks.named('preBuild').configure {
    doFirst {
        if (providers.gradleProperty('foldgptRuntimeQualification').getOrElse('false') != 'true') {
            throw new GradleException('Runtime qualification requires its isolated Gradle output property')
        }
        def record = staged.get().file('build-inventory.json').asFile
        if (!record.isFile()) throw new GradleException('Run stage-runtime-qualification.py with reviewed final inputs first')
        def inventory = new groovy.json.JsonSlurper().parse(record)
        if (inventory.schema != 'foldgpt.runtime-qualification-build.v1'
                || inventory.package != runtimePackage || inventory.base != runtimeBase) {
            throw new GradleException('Runtime staging has a different diagnostic identity')
        }
        inventory.files.each { entry ->
            def source = new File(staged.get().asFile, entry.path)
            if (!source.isFile() || !source.canonicalPath.startsWith(staged.get().asFile.canonicalPath + File.separator)
                    || java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() != entry.sha256) {
                throw new GradleException('Runtime staged file differs: ' + entry.path)
            }
        }
    }
}
dependencies {
    implementation project(':transport')
    compileOnly 'androidx.annotation:annotation:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
