name: Native engine validation
run-name: Native engine ${{ github.ref_name }} (${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      native_python_only:
        description: Run only native Linux Python qualification
        type: boolean
        default: false
      full_rust_checks:
        description: After targeted tests pass, run the complete Rust suite and final fix/format
        type: boolean
        default: false
      linux_tests_only:
        description: Qualify Linux engine tests without rebuilding unchanged ARM64 production code
        type: boolean
        default: false
      arm_build_only:
        description: Build ARM64 and qualify native Python while a Linux validation remains active
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-engine-${{ github.ref }}-${{ inputs.linux_tests_only }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_PROFILE_TEST_STRIP: symbols
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_TOOLCHAIN: 1.95.0
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_HOME: ${{ github.workspace }}/work/ci/cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/work/ci/cache/rustup
  CARGO_TARGET_DIR: ${{ github.workspace }}/work/ci/target

jobs:
  native-python:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Install Linux build prerequisites
        run: bash tools/ci/setup-linux.sh native-python
      - name: Compile frozen native Linux helpers
        run: python3 -B tools/ci/native_validation.py helpers
      - name: Qualify real native Linux Python execution
        run: python3 -B tools/ci/native_validation.py python-tests
      - name: Preserve native evidence in the private repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-python-${{ github.sha }}-${{ github.run_attempt }}
          path: work/ci/evidence/
          if-no-files-found: error
          retention-days: 14

  engine:
    if: ${{ github.event.repository.private == true && !inputs.native_python_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arm_build_only && '[{"stage":"arm64-build","target":"aarch64-unknown-linux-gnu"}]' || inputs.linux_tests_only && '[{"stage":"linux-tests","target":"x86_64-unknown-linux-gnu"}]' || '[{"stage":"linux-tests","target":"x86_64-unknown-linux-gnu"},{"stage":"arm64-build","target":"aarch64-unknown-linux-gnu"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Restore exact engine source from the checked recovery export
        run: python3 -B tools/ci/native_validation.py restore
      - name: Recover unused SDK space on this disposable Linux runner
        run: python3 -B tools/ci/prepare-runner-storage.py
      - name: Restore versioned tool and source caches
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/ci/cache/
            work/ci/tools/
          key: native-ci-v1-${{ runner.os }}-${{ matrix.target }}-rust1.95.0-just1.58.0-nextest0.9.143-${{ hashFiles('work/ci/engine/codex-rs/Cargo.lock') }}
      - name: Install the pinned Linux toolchain
        run: bash tools/ci/setup-linux.sh '${{ matrix.stage }}'
      - name: Restore compatible compiled engine dependencies
        id: target-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/ci/target/
          key: native-target-${{ matrix.stage == 'linux-tests' && 'v2-stripped' || 'v1' }}-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('work/ci/engine/codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-target-${{ matrix.stage == 'linux-tests' && 'v2-stripped' || 'v1' }}-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('work/ci/engine/codex-rs/Cargo.lock') }}-
      - name: Fetch and verify the official V8 archive and matching bindings
        run: python3 -B tools/ci/native_validation.py v8 --target '${{ matrix.target }}'
      - name: Preserve verified tools before engine compilation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/ci/cache/
            work/ci/tools/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Compile frozen native Linux helpers
        if: matrix.stage == 'linux-tests'
        run: python3 -B tools/ci/native_validation.py helpers
      - name: Compile the engine and run selected real integration tests
        if: matrix.stage == 'linux-tests'
        run: python3 -B tools/ci/native_validation.py engine-tests
      - name: Run the complete Rust suite and final source checks
        if: matrix.stage == 'linux-tests' && inputs.full_rust_checks
        run: python3 -B tools/ci/native_validation.py engine-final-checks
      - name: Compile the verified official OpenSSL source for GNU ARM64
        if: matrix.stage == 'arm64-build'
        run: python3 -B tools/ci/native_validation.py arm-dependencies
      - name: Compile and package the separate GNU ARM64 engine and companion
        if: matrix.stage == 'arm64-build'
        run: python3 -B tools/ci/native_validation.py arm-build
      - name: Preserve build logs and evidence in the private repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.stage }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/ci/evidence/
            !work/ci/evidence/arm64-gnu/
            work/ci/target/cargo-timings/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled dependencies after success or failure
        if: always() && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/ci/target/
          key: ${{ steps.target-cache.outputs.cache-primary-key }}
