name: public-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          python -m compileall -q tools config tests
          python -m unittest discover -s tools -p 'test_*.py'
