name: public-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install -r tools/ci/requirements-host.txt
      - name: Source export integrity
        run: python tools/ci/check-source-integrity.py
      - name: Python syntax
        run: python -m compileall -q runtime tools config tests
      - name: Linux host regression suites
        run: |
          python tools/ci/run-host-tests.py
