name: public-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install --require-hashes -r tools/ci/requirements-host.txt
      - name: Source export integrity
        run: python tools/ci/check-source-integrity.py
      - name: Python syntax
        run: python -m compileall -q runtime tools config tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Showcase graphics recovery
        run: node site/test-scene.mjs
      - name: Linux host regression suites
        run: |
          python tools/ci/run-host-tests.py

  lifecycle-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned JVM test dependencies
        shell: bash
        run: |
          mkdir -p work/ci-jvm-deps
          cd work/ci-jvm-deps
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o junit.jar
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o hamcrest.jar
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' https://repo.maven.apache.org/maven2/org/json/json/20260719/json-20260719.jar -o json.jar
          sha256sum --check <<'HASHES'
          8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  junit.jar
          66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  hamcrest.jar
          c243f45f9590c12694a4142ed3f07fc70dfb71e4daebd05ae234bf92a2da92a6  json.jar
          HASHES
      - name: Real JVM worker and child-process lifecycle
        run: >-
          python3 tools/runtime/test-native-lifecycle-windows.py
          --java-home "$JAVA_HOME"
          --junit work/ci-jvm-deps/junit.jar
          --hamcrest work/ci-jvm-deps/hamcrest.jar
          --json work/ci-jvm-deps/json.jar
          --output work/ci-lifecycle
